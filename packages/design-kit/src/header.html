<!--
  Header of joeyoosenbrug.nl for the *.joeyoosenbrug.nl apps. Copy this block as the first thing in <body>.
  Change only what is marked CHANGE; keep classes, structure and icons as they are.
  Styles: kit.css + header.css. Behaviour: initJoHeader() from @joeykwispel/design-kit/header.
-->
<a class="skip" href="#main">Skip to content</a>

<header class="jo-nav">
  <div class="jo-nav__progress" aria-hidden="true"></div>
  <div class="jo-nav__bar">
    <!-- The logo always goes back to the portfolio. -->
    <a class="jo-nav__logo" href="https://joeyoosenbrug.nl/" aria-label="joeyoosenbrug.nl"
      ><span class="jo-nav__br">&lt;</span>JO<span class="jo-nav__br">/&gt;</span></a
    >

    <nav class="jo-nav__menu" aria-label="Main">
      <ul>
        <!-- CHANGE: one <li> per link. Numbers count up: 01., 02., ...
             Mark the current page with aria-current="page". Links to #sections on the same page are marked for you. -->
        <li>
          <a class="jo-nav__link" href="/en/" aria-current="page"><span class="jo-nav__idx">01.</span>Skills</a>
        </li>
        <li>
          <a class="jo-nav__link" href="/en/career/"><span class="jo-nav__idx">02.</span>Career</a>
        </li>
        <li>
          <a class="jo-nav__link" href="/en/repos/"><span class="jo-nav__idx">03.</span>My repos</a>
        </li>
        <li>
          <a class="jo-nav__link" href="/en/any-repo/"><span class="jo-nav__idx">04.</span>Any repo</a>
        </li>
      </ul>
    </nav>

    <div class="jo-nav__tools">
      <!-- Optional: only if the app has a command menu. Remove the `hidden` attribute and pass onSearch to initJoHeader(). -->
      <button type="button" class="jo-nav__search" aria-label="Command menu" aria-keyshortcuts="Control+K Meta+K" hidden>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <kbd>Ctrl K</kbd>
      </button>

      <!-- CHANGE: the same page in each language. aria-current="true" on the active one. -->
      <div class="jo-nav__lang" role="group" aria-label="Switch language">
        <a href="/en/" hreflang="en" aria-current="true">EN</a>
        <a href="/nl/" hreflang="nl">NL</a>
      </div>

      <!-- Labels for the theme button: data-label-dark is shown in dark mode, data-label-light in light mode. -->
      <button
        type="button"
        class="jo-nav__icon jo-nav__theme"
        aria-label="Switch to light theme"
        data-label-dark="Switch to light theme"
        data-label-light="Switch to dark theme"
      >
        <svg
          class="jo-nav__sun"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
        <svg
          class="jo-nav__moon"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      </button>

      <button type="button" class="jo-nav__icon jo-nav__burger" aria-expanded="false" aria-label="Menu">
        <svg
          class="jo-nav__open"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
        <svg
          class="jo-nav__close"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </div>
  </div>
</header>
